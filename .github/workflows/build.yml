name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Resolve dependencies, compile, test and build
        run: ./gradlew --no-daemon --console=plain compileKotlin test runGameTestServer build
      - name: Upload mod and reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: CraftLocator
          path: |
            build/libs/*.jar
            build/reports/tests/
            runs/gametest/logs/
          if-no-files-found: error
